<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Mea+Culpa&family=Poppins:ital,wght@0,500;0,700;0,800;0,900;1,800;1,900&display=block" rel="stylesheet">
<style>
  :root{--ink:#121212;--muted:#6d6a63;--band:#56564d;--bg1:#f1f0ec;--bg2:#d6d5cf;--accent:#5b2d82}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg1)}
  body{font-family:"Poppins",sans-serif;color:var(--ink)}
  #stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse 80% 60% at 50% 42%,var(--bg1) 0%,#e7e6e1 55%,var(--bg2) 100%)}
  #dotgrid{position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.07) 1.6px,transparent 1.8px);background-size:46px 46px;opacity:.55}
  .layer{position:absolute;inset:0}
  .scene{position:absolute;inset:0;display:none}
  .band{position:absolute;left:-40px;right:-40px;height:250px;background:var(--band);transform-origin:0 50%}
  .txt{position:absolute;left:80px;right:80px;text-align:center}
  .kick{font-family:"Mea Culpa","Great Vibes",cursive;font-size:108px;line-height:1;color:#151515;display:block;margin-bottom:-4px}
  .head{font-weight:900;font-size:150px;letter-spacing:-0.045em;line-height:.92;display:block}
  .head.it{font-style:italic}
  .w{display:inline-block;margin:0 .1em;will-change:transform,opacity,filter}
  .acc{color:var(--accent)}
  .obj{position:absolute;left:50%;will-change:transform,filter}
  .shadow{filter:drop-shadow(0 38px 34px rgba(0,0,0,.28)) drop-shadow(0 8px 10px rgba(0,0,0,.18))}
  .blurshape{position:absolute;will-change:transform}
  #end{position:absolute;inset:0;background:#0b0b0b;display:none;align-items:center;justify-content:center;flex-direction:column}
  #end .s{font-family:"Great Vibes",cursive;color:#f2f0ea;font-size:150px;line-height:1}
  #end .h{font-weight:700;color:#f2f0ea;font-size:46px;margin-top:10px}
  .card{position:absolute;border-radius:34px;background:linear-gradient(135deg,#6a3a92,#3d1b5c);box-shadow:0 40px 60px rgba(40,10,70,.35),0 10px 18px rgba(0,0,0,.2);overflow:hidden}
  .list{position:absolute;font-weight:500;font-size:46px;color:#222}
  .list .li{display:flex;align-items:center;gap:26px;height:74px}
  .list .dot{width:26px;height:26px;border-radius:50%;background:#3d1b5c}
  .dash{position:absolute;fill:none;stroke:#8a8780;stroke-width:5;stroke-dasharray:16 18;stroke-linecap:round}
</style></head>
<body>
<div id="stage">
  <div id="dotgrid"></div>
  <svg width="0" height="0" style="position:absolute"><defs id="defs"></defs></svg>
  <div class="layer" id="back"></div>
  <div class="layer" id="scenes"></div>
  <div class="layer" id="front"></div>
  <div id="end"><div class="s"></div><div class="h"></div></div>
</div>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eOut=t=>1-Math.pow(1-clamp(t),4);
const eIn=t=>Math.pow(clamp(t),3);
const eInOut=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eBack=t=>{t=clamp(t);const c1=1.4,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const prog=(t,s,d)=>clamp((t-s)/d);
const $=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const defs=document.getElementById('defs');
let fid=0;
// directional motion-blur filter, returns {id, set(x,y)}
function mblur(){const id='mb'+(fid++);
  defs.insertAdjacentHTML('beforeend',`<filter id="${id}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="0 0"/></filter>`);
  const g=defs.querySelector('#'+id+' feGaussianBlur');
  return {id,set(x,y){g.setAttribute('stdDeviation',`${Math.max(0,x).toFixed(2)} ${Math.max(0,y).toFixed(2)}`)}};
}
function words(txt){let mode=false;return txt.split(' ').map(w=>{let s=mode;
  if(!mode&&w.startsWith('*')){mode=true;s=true;w=w.slice(1)}
  let close=mode&&/\*[.,…!?:]?$/.test(w);if(close)w=w.replace('*','');
  const h=`<span class="w${s?' acc':''}">${w}</span>`;if(close)mode=false;return h}).join(' ')}
// words slide up with vertical motion blur
function riseWords(el,lt,stag=.06,dur=.5,dist=90){
  el.querySelectorAll('.w').forEach((w,i)=>{const p=prog(lt,i*stag,dur),k=eOut(p);
    w.style.opacity=clamp(p*2.2);w.style.transform=`translateY(${(1-k)*dist}px)`;
    w.style.filter=`blur(${(1-k)*10}px)`;});
}
// kicker (script) writes on with a soft fade+drift
function kickIn(el,lt){el.style.opacity=eOut(prog(lt,0,.5));el.style.transform=`translateX(${(1-eOut(prog(lt,0,.7)))*-40}px)`;el.style.filter=`blur(${(1-eOut(prog(lt,0,.5)))*6}px)`}

// ---------- realistic-ish props (SVG with gradients + drop shadows) ----------
let uid=0;
const uniq=svg=>{const n='_'+(uid++);return svg.replace(/id="([a-z]+)"/g,(m,a)=>`id="${a}${n}"`).replace(/url\(#([a-z]+)\)/g,(m,a)=>`url(#${a}${n})`)};
const PROPS0={
stopwatch:(s)=>`<svg viewBox="0 0 400 460" width="${s}" height="${s*1.15}">
 <defs><radialGradient id="swm" cx="35%" cy="30%"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#c9ccd1"/><stop offset=".8" stop-color="#7e838b"/><stop offset="1" stop-color="#e6e8eb"/></radialGradient>
 <radialGradient id="swd" cx="45%" cy="40%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9e7e2"/></radialGradient>
 <linearGradient id="swk" x1="0" x2="1"><stop offset="0" stop-color="#8d929a"/><stop offset=".5" stop-color="#f4f5f6"/><stop offset="1" stop-color="#8d929a"/></linearGradient></defs>
 <rect x="172" y="18" width="56" height="50" rx="10" fill="url(#swk)"/><circle cx="200" cy="18" r="26" fill="none" stroke="url(#swk)" stroke-width="12"/>
 <rect x="300" y="78" width="40" height="34" rx="8" fill="url(#swk)" transform="rotate(42 320 95)"/>
 <circle cx="200" cy="265" r="182" fill="url(#swm)"/><circle cx="200" cy="265" r="156" fill="url(#swd)" stroke="#9aa0a7" stroke-width="3"/>
 ${Array.from({length:60},(_,i)=>{const a=i*6*Math.PI/180,r1=i%5?146:136,r2=152;return `<line x1="${200+Math.sin(a)*r1}" y1="${265-Math.cos(a)*r1}" x2="${200+Math.sin(a)*r2}" y2="${265-Math.cos(a)*r2}" stroke="${i%15?'#333':'#c0262d'}" stroke-width="${i%5?2:4}"/>`}).join('')}
 ${[60,5,10,15,20,25,30,35,40,45,50,55].map((n,i)=>{const a=i*30*Math.PI/180;return `<text x="${200+Math.sin(a)*116}" y="${265-Math.cos(a)*116+11}" font-family="Poppins" font-weight="700" font-size="30" text-anchor="middle" fill="${n%15===0?'#c0262d':'#222'}">${n}</text>`}).join('')}
 <circle cx="200" cy="320" r="34" fill="none" stroke="#999" stroke-width="2"/>
 <g class="hand"><line x1="200" y1="290" x2="200" y2="140" stroke="#c0262d" stroke-width="6" stroke-linecap="round"/></g>
 <circle cx="200" cy="265" r="12" fill="#c0262d"/></svg>`,
shirt:(s)=>`<svg viewBox="0 0 420 470" width="${s}" height="${s*1.12}">
 <defs><linearGradient id="sh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#ecebe8"/><stop offset="1" stop-color="#cfcdc8"/></linearGradient>
 <linearGradient id="hg" x1="0" x2="1"><stop offset="0" stop-color="#6e4a2a"/><stop offset=".5" stop-color="#b98b5a"/><stop offset="1" stop-color="#6e4a2a"/></linearGradient></defs>
 <path d="M210 16 q0 -14 14 -10 q12 6 2 20 l-16 18" fill="none" stroke="#9aa0a7" stroke-width="7" stroke-linecap="round"/>
 <path d="M60 92 L210 40 L360 92" fill="none" stroke="url(#hg)" stroke-width="16" stroke-linecap="round"/>
 <path d="M130 70 L40 120 L72 205 L118 186 L118 450 L302 450 L302 186 L348 205 L380 120 L290 70 Q260 105 210 105 Q160 105 130 70 Z" fill="url(#sh)" stroke="#bdbab4" stroke-width="2"/>
 <path d="M168 76 L210 150 L252 76" fill="none" stroke="#bdbab4" stroke-width="3"/>
 <line x1="210" y1="150" x2="210" y2="450" stroke="#cfcdc8" stroke-width="3"/>
 ${[190,240,290,340,390].map(y=>`<circle cx="210" cy="${y}" r="6" fill="#e9e7e2" stroke="#a9a59e" stroke-width="2"/>`).join('')}
 <path d="M140 300 q20 60 0 140" fill="none" stroke="rgba(0,0,0,.06)" stroke-width="14"/></svg>`,
bag:(s)=>`<svg viewBox="0 0 400 460" width="${s}" height="${s*1.15}">
 <defs><linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#2b2b2b"/><stop offset=".55" stop-color="#151515"/><stop offset="1" stop-color="#050505"/></linearGradient>
 <linearGradient id="bs" x1="0" x2="1"><stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#1c1c1c"/></linearGradient></defs>
 <path d="M140 130 Q140 40 200 40 Q260 40 260 130" fill="none" stroke="#c9a96a" stroke-width="12"/>
 <path d="M70 130 L330 130 L350 440 L50 440 Z" fill="url(#bg)"/><path d="M330 130 L370 150 L385 425 L350 440 Z" fill="url(#bs)"/>
 <circle cx="140" cy="160" r="9" fill="#c9a96a"/><circle cx="260" cy="160" r="9" fill="#c9a96a"/>
 <text x="200" y="320" font-family="Poppins" font-weight="800" font-size="46" letter-spacing="10" fill="#f1efe9" text-anchor="middle">MODA</text></svg>`,
store:(s)=>`<svg viewBox="0 0 440 420" width="${s}" height="${s*.95}">
 <defs><linearGradient id="wl" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fbfaf7"/><stop offset="1" stop-color="#dcdad4"/></linearGradient>
 <linearGradient id="gl" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#cfe0e6"/><stop offset=".5" stop-color="#93aab3"/><stop offset="1" stop-color="#5f7680"/></linearGradient></defs>
 <rect x="30" y="110" width="380" height="290" fill="url(#wl)"/>
 <rect x="20" y="70" width="400" height="60" fill="#151515"/>
 <text x="220" y="114" font-family="Poppins" font-weight="800" font-size="40" letter-spacing="14" fill="#f4f2ec" text-anchor="middle">STORE</text>
 ${Array.from({length:8},(_,i)=>`<path d="M${20+i*50} 130 h50 v26 q-25 22 -50 0 z" fill="${i%2?'#e9e7e2':'#56564d'}"/>`).join('')}
 <rect x="60" y="190" width="140" height="210" fill="url(#gl)"/><rect x="240" y="190" width="140" height="150" fill="url(#gl)"/>
 <path d="M90 250 l30 -20 l30 20 v90 h-60 z" fill="#f3f1ec" opacity=".9"/><line x1="130" y1="190" x2="130" y2="400" stroke="#2a2a2a" stroke-width="5"/>
 <rect x="20" y="398" width="400" height="12" fill="#9a978f"/></svg>`,
globe:(s)=>`<svg viewBox="0 0 420 420" width="${s}" height="${s}">
 <defs><radialGradient id="gb" cx="35%" cy="30%"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#d9d7d1"/><stop offset="1" stop-color="#8f8c85"/></radialGradient>
 <clipPath id="gc"><circle cx="210" cy="210" r="190"/></clipPath></defs>
 <circle cx="210" cy="210" r="190" fill="url(#gb)"/>
 <ellipse cx="210" cy="210" rx="40" ry="190" fill="none" stroke="#3a3a36" stroke-width="3" opacity=".55"/><ellipse cx="210" cy="210" rx="95" ry="190" fill="none" stroke="#3a3a36" stroke-width="3" opacity=".55"/><ellipse cx="210" cy="210" rx="150" ry="190" fill="none" stroke="#3a3a36" stroke-width="3" opacity=".55"/><line x1="63" y1="90" x2="357" y2="90" stroke="#3a3a36" stroke-width="3" opacity=".55"/><line x1="30" y1="150" x2="390" y2="150" stroke="#3a3a36" stroke-width="3" opacity=".55"/><line x1="20" y1="210" x2="400" y2="210" stroke="#3a3a36" stroke-width="3" opacity=".55"/><line x1="30" y1="270" x2="390" y2="270" stroke="#3a3a36" stroke-width="3" opacity=".55"/><line x1="63" y1="330" x2="357" y2="330" stroke="#3a3a36" stroke-width="3" opacity=".55"/>
 <ellipse cx="210" cy="210" rx="190" ry="60" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2"/>
 <ellipse cx="210" cy="210" rx="80" ry="190" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2"/>
 <circle cx="150" cy="130" r="70" fill="rgba(255,255,255,.25)"/></svg>`,
coins:(s)=>`<svg viewBox="0 0 400 420" width="${s}" height="${s*1.05}">
 <defs><linearGradient id="cg" x1="0" x2="1"><stop offset="0" stop-color="#8a6a1e"/><stop offset=".45" stop-color="#f3d77a"/><stop offset="1" stop-color="#9c7a25"/></linearGradient>
 <radialGradient id="ct" cx="40%" cy="40%"><stop offset="0" stop-color="#fff2b8"/><stop offset="1" stop-color="#c9a341"/></radialGradient></defs>
 ${Array.from({length:9},(_,i)=>{const y=370-i*34;return `<rect x="90" y="${y-26}" width="220" height="30" fill="url(#cg)"/><ellipse cx="200" cy="${y+4}" rx="110" ry="24" fill="url(#cg)"/>`}).join('')}
 <ellipse cx="200" cy="72" rx="110" ry="24" fill="url(#ct)"/><text x="200" y="84" font-family="Poppins" font-weight="900" font-size="34" fill="#8a6a1e" text-anchor="middle">$</text></svg>`,
star:(s,c='#151515')=>`<svg viewBox="0 0 200 200" width="${s}" height="${s}"><path d="M100 0 L118 72 L190 60 L130 108 L170 180 L100 136 L30 180 L70 108 L10 60 L82 72 Z" fill="${c}"/></svg>`,
curve:(s,c='#3d3d38')=>`<svg viewBox="0 0 200 400" width="${s/2}" height="${s}"><path d="M150 0 Q20 120 120 200 Q210 280 60 400" fill="none" stroke="${c}" stroke-width="26" stroke-linecap="round"/></svg>`
};

const PROPS=new Proxy(PROPS0,{get:(o,k)=>(...a)=>uniq(o[k](...a))});
// ---------- background ambience: big blurred shapes with parallax ----------
function ambience(cfg){
  const back=document.getElementById('back'),front=document.getElementById('front');
  return (cfg||[]).map(a=>{const el=$(`<div class="blurshape">${PROPS[a.shape](a.size,a.color)}</div>`);(a.front?front:back).appendChild(el);return {...a,el}});
}

// ---------- scene builders ----------
const B={
 // kicker (script) + headline (bold) + optional prop + optional band
 kinetic(d){
  const top=d.textTop??300;
  const el=$(`<div class="scene">
    ${d.band?`<div class="band" style="top:${d.band}px"></div>`:''}
    ${d.prop?`<div class="obj shadow" style="top:${d.propTop??820}px">${PROPS[d.prop](d.propSize||560)}</div>`:''}
    <div class="txt" style="top:${top}px;${d.align?'text-align:'+d.align:''}">
      ${d.kicker?`<span class="kick">${d.kicker}</span>`:''}
      <span class="head${d.italic?' it':''}" style="font-size:${d.size||150}px">${words(d.text||'')}</span>
      ${d.sub?`<span class="kick sub" style="font-size:72px;margin-top:20px">${d.sub}</span>`:''}
    </div></div>`);
  const band=el.querySelector('.band'),obj=el.querySelector('.obj'),k=el.querySelector('.kick'),head=el.querySelector('.head'),sub=el.querySelector('.sub');
  const mb=mblur(); if(obj) obj.style.filter=`url(#${mb.id}) drop-shadow(0 38px 34px rgba(0,0,0,.28))`;
  const hand=el.querySelector('.hand');
  return {el,update(lt,dur){
    if(band){const p=eInOut(prog(lt,.05,.55));band.style.transform=`scaleX(${p})`}
    if(obj){const p=prog(lt,.15,.6),k2=eOut(p);
      obj.style.transform=`translateX(-50%) translateY(${(1-k2)*500+Math.sin(lt*1.3)*10}px) rotate(${(1-k2)*-14+(d.tilt||0)}deg) scale(${lerp(.85,1,k2)*(1+lt*.012)})`;
      obj.style.opacity=clamp(p*3);mb.set(0,(1-k2)*40);
      if(hand)hand.setAttribute('transform',`rotate(${lt*(d.spin||90)} 200 265)`);}
    if(k)kickIn(k,lt);
    riseWords(head,lt-(k?.35:.05),.07);
    if(sub)kickIn(sub,lt-1.1);
  }};
 },
 counter(d){
  const el=$(`<div class="scene">
    ${d.band?`<div class="band" style="top:${d.band}px"></div>`:''}
    <div class="txt" style="top:${d.textTop??560}px">
     <span class="kick">${d.kicker||''}</span>
     <span class="head n" style="font-size:${d.size||330}px;font-variant-numeric:tabular-nums">0</span>
     <span class="kick lab" style="font-size:92px;margin-top:70px">${d.label||''}</span></div></div>`);
  const n=el.querySelector('.n'),band=el.querySelector('.band');
  return {el,update(lt){
    if(band)band.style.transform=`scaleX(${eInOut(prog(lt,.05,.55))})`;
    kickIn(el.querySelector('.kick'),lt);
    const p=eOut(prog(lt,.3,1.3));n.textContent=(d.prefix||'')+Math.round(lerp(d.from??0,d.to,p))+(d.suffix||'');
    n.style.opacity=clamp(prog(lt,.3,.2));n.style.filter=`blur(${(1-eOut(prog(lt,.3,.4)))*12}px)`;
    n.style.transform=`translateY(${(1-eOut(prog(lt,.3,.5)))*80}px)`;
    kickIn(el.querySelector('.lab'),lt-1.3);
  }};
 },
 letters(d){
  const A=d.from.split(''),Z=d.to.split(''),W=170;
  const el=$(`<div class="scene"><div class="band" style="top:820px"></div>
    <div class="txt" style="top:420px"><span class="kick">${d.kicker||''}</span></div>
    <div class="row" style="position:absolute;left:0;right:0;top:830px;height:240px"></div>
    <div class="txt" style="top:1230px"><span class="kick k2" style="font-size:76px">${d.after||''}</span></div></div>`);
  const row=el.querySelector('.row'),used=new Array(Z.length).fill(false);
  const map=A.map(ch=>{const j=Z.findIndex((c,i)=>c===ch&&!used[i]);if(j>=0){used[j]=true;return j}return -1});
  const mk=(ch,col)=>{const s=$(`<span style="position:absolute;top:0;width:${W}px;text-align:center;font-weight:900;font-size:230px;line-height:240px;color:${col}">${ch}</span>`);row.appendChild(s);return s};
  const sp=A.map(ch=>mk(ch,'#f2f0ea'));
  const extra=Z.map((ch,j)=>used[j]?null:{s:mk(ch,'#f2f0ea'),j}).filter(Boolean);
  return {el,update(lt,dur){
    el.querySelector('.band').style.transform=`scaleX(${eInOut(prog(lt,.05,.5))})`;
    kickIn(el.querySelector('.kick'),lt);
    const mv=eInOut(prog(lt,dur*.42,.8));
    sp.forEach((s,i)=>{const x0=(i-(A.length-1)/2)*W,j=map[i],x1=j>=0?(j-(Z.length-1)/2)*W:x0,ap=eOut(prog(lt,.3+i*.06,.45));
      s.style.left=`calc(50% + ${lerp(x0,x1,mv)}px - ${W/2}px)`;
      if(j<0){s.style.opacity=clamp(ap)*(1-mv);s.style.transform=`translateY(${-mv*260}px)`;s.style.filter=`blur(${mv*16}px)`}
      else{s.style.opacity=clamp(ap);s.style.transform=`translateY(${(1-ap)*120}px)`;s.style.filter=`blur(${(1-ap)*12}px)`}});
    extra.forEach(({s,j})=>{const k=eOut(prog(lt,dur*.42+.55,.45));s.style.left=`calc(50% + ${(j-(Z.length-1)/2)*W}px - ${W/2}px)`;s.style.opacity=clamp(k);s.style.transform=`translateY(${(1-k)*-200}px)`;s.style.filter=`blur(${(1-k)*14}px)`});
    kickIn(el.querySelector('.k2'),lt-dur*.6);
  }};
 },
 compare(d){
  const el=$(`<div class="scene">
    <div class="txt" style="top:330px"><span class="kick">${d.kicker||''}</span><span class="head" style="font-size:130px">${words(d.text||'')}</span></div>
    <div style="position:absolute;left:110px;right:110px;top:900px">
      <div class="la" style="font-weight:700;font-size:54px;margin-bottom:16px">${d.a.label} <span style="font-family:'Mea Culpa';font-weight:400;font-size:70px;color:var(--muted)">${d.a.value}</span></div>
      <div style="height:64px;border-radius:32px;background:rgba(0,0,0,.08)"><div class="ba" style="height:64px;border-radius:32px;background:var(--band);width:0"></div></div>
      <div class="lb" style="font-weight:700;font-size:54px;margin:70px 0 16px">${d.b.label} <span style="font-family:'Mea Culpa';font-weight:400;font-size:70px;color:var(--accent)">${d.b.value}</span></div>
      <div style="height:64px;border-radius:32px;background:rgba(0,0,0,.08)"><div class="bb" style="height:64px;border-radius:32px;background:#111;width:0"></div></div>
    </div></div>`);
  return {el,update(lt,dur){
    kickIn(el.querySelector('.kick'),lt);riseWords(el.querySelector('.head'),lt-.3,.07);
    [['.la',.7],['.lb',1.0]].forEach(([s,t])=>{const q=el.querySelector(s);q.style.opacity=eOut(prog(lt,t,.4));q.style.transform=`translateX(${(1-eOut(prog(lt,t,.5)))*-60}px)`});
    el.querySelector('.ba').style.width=eInOut(prog(lt,.8,dur*.6))*100+'%';
    el.querySelector('.bb').style.width=eBack(prog(lt,1.2,.6))*d.b.ratio*100+'%';
  }};
 },
 // purple card with title + growing timeline list (ref 1)
 cardlist(d){
  const el=$(`<div class="scene">
    <svg class="dash" style="left:-60px;top:120px" width="500" height="300"><path d="M10 280 Q200 40 480 20"/></svg>
    <svg class="dash" style="right:-80px;top:1500px" width="520" height="320"><path d="M10 300 Q260 300 500 10"/></svg>
    <div class="card" style="left:170px;top:520px;width:740px;height:420px">
      <div style="position:absolute;left:50px;top:60px;color:#f4f0f8;font-weight:900;font-style:italic;font-size:110px;letter-spacing:-.04em;line-height:.9">${d.title}</div>
      <div style="position:absolute;left:56px;top:190px;color:#d8c8e8;font-family:'Mea Culpa';font-size:70px">${d.subtitle||''}</div>
      ${d.prop?`<div style="position:absolute;right:30px;bottom:-10px">${PROPS[d.prop](300)}</div>`:''}
    </div>
    <div class="vline" style="position:absolute;left:232px;top:940px;width:6px;background:#3d1b5c;height:0"></div>
    <div class="list" style="left:222px;top:990px">${d.items.map(t=>`<div class="li"><div class="dot"></div><div>${t}</div></div>`).join('')}</div></div>`);
  const card=el.querySelector('.card'),lis=[...el.querySelectorAll('.li')],vl=el.querySelector('.vline');
  return {el,update(lt,dur){
    const k=eBack(prog(lt,.1,.6));card.style.transform=`scale(${lerp(.6,1,k)}) translateY(${(1-k)*80}px)`;card.style.opacity=clamp(prog(lt,.1,.2));
    const step=(dur-1.6)/lis.length;
    lis.forEach((li,i)=>{const p=eOut(prog(lt,1+i*step,.4));li.style.opacity=p;li.style.transform=`translateX(${(1-p)*-40}px)`;li.style.filter=`blur(${(1-p)*6}px)`});
    const shown=lis.filter((_,i)=>lt>1+i*step).length;vl.style.height=Math.max(0,(shown-0.5)*74+50)*eOut(prog(lt,.9,.3))+'px';
    el.querySelectorAll('.dash path').forEach(p=>{if(!p._l){p._l=p.getTotalLength();p.style.strokeDasharray=`16 18`}p.parentNode.style.opacity=eOut(prog(lt,0,.8))});
  }};
 }
};

// ---------- timeline ----------
let V,built=[],amb=[];
function setup(video){
  V=video;const host=document.getElementById('scenes');
  amb=ambience(V.ambience);
  built=V.scenes.map(s=>{if(s.type==='end')return {...s,end_:true,update(){} ,el:null};const b=B[s.type](s);
    const wrap=$(`<div class="scene" style="display:none"></div>`);const m=mblur();wrap.style.filter=`url(#${m.id})`;
    b.el.style.display='block';wrap.appendChild(b.el);host.appendChild(wrap);return {...s,...b,el:wrap,mb:m}});
}
function renderAt(t){
  let active=null;
  built.forEach((s,i)=>{
    if(s.end_){const e=document.getElementById('end');const on=t>=s.start;e.style.display=on?'flex':'none';
      if(on){const lt=t-s.start;e.querySelector('.s').textContent=s.script;e.querySelector('.h').textContent=s.handle||'';
        e.querySelector('.s').style.opacity=eOut(prog(lt,.2,.8));e.querySelector('.s').style.filter=`blur(${(1-eOut(prog(lt,.2,.8)))*10}px)`;
        e.querySelector('.h').style.opacity=eOut(prog(lt,.9,.5));e.style.opacity=eOut(prog(lt,0,.25))}
      return;}
    const on=t>=s.start&&t<s.end;s.el.style.display=on?'block':'none';if(!on)return;
    active=s;const lt=t-s.start,dur=s.end-s.start;s.update(lt,dur);
    // whip transition: enter from right, exit to left, with horizontal motion blur
    const tin=prog(lt,0,.28),tout=prog(lt,dur-.24,.24);
    const xin=(1-eOut(tin))*520, xout=-eIn(tout)*620;
    s.el.style.transform=`translateX(${xin+xout}px) scale(${1+lt*.01})`;
    s.el.style.opacity=Math.min(clamp(tin*3),1-clamp((tout-.6)*2.5));
    s.mb.set((1-eOut(tin))*60+eIn(tout)*70,0);
  });
  // ambience parallax: shapes drift, some react to scene changes
  amb.forEach((a,i)=>{const dx=Math.sin(t*(a.speed||.3)+i)*a.drift,dy=Math.cos(t*(a.speed||.3)*.8+i)*a.drift*.6;
    a.el.style.left=a.x+'px';a.el.style.top=a.y+'px';
    a.el.style.transform=`translate(${dx}px,${dy}px) rotate(${(a.rot||0)+t*(a.spin||4)}deg)`;
    a.el.style.filter=`blur(${a.blur}px)`;a.el.style.opacity=a.opacity??1;
    a.el.style.display=(t>=(a.from??0)&&t<(a.to??1e9))?'block':'none';});
}
window.setup=setup;window.renderAt=renderAt;
</script></body></html>

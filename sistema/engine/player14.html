  const f=t*60;

  if(cardOn){const n=Math.floor(cl((f-111)/(1.25*TITLE.length))*TITLE.length);$('ttl').textContent=TITLE.slice(0,n)+(f<146&&Math.floor(f/15)%2?'|':'');

  const gl=$('glow');let gq=0;if(f>=318&&f<330)gq=Math.max(0,1-Math.abs(f-322)/6);if(f>=370&&f<384)gq=Math.max(gq,1-Math.abs(f-377)/7);if(f>=506&&f<524)gq=Math.max(gq,1-Math.abs(f-512)/10);
